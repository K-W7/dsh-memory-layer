name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 下限 22.19.0 纳入矩阵；node:sqlite 自 Node 22.13 起无需 flag
        node: ['22.19.x', '24.x']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts：零运行时依赖；忽略第三方安装脚本
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 发布一致性自检
        run: node scripts/release-check.mjs

      - name: 单元测试
        run: npm test

      - name: 打包预演（npm pack --dry-run）
        run: npm pack --dry-run
